<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規受講生登録</title>
</head>
<body>
<h1>新規受講生登録シート</h1>
<form th:action="@{/registration}" th:object="${studentDetail}" method="post">
  <div>
    <label for="course_name">コース名:</label>
    <select id="course_name" th:field="*{studentsCourses.courseName}" required >
      <option value="">選択してください</option>
      <option value="Java Basic">Java Basic</option>
      <option value="Python Basic">Python Basic</option>
      <option value="Web Development">Web Development</option>
      <option value="Database SQL ">Database SQL </option>
      <option value="AI Intro">AI Intro</option>
    </select>

    <label for="name">名前:</label>
    <input type="text" id="name" th:field="*{students.name}" required />

    <label for="kana_name">カナ名:</label>
    <input type="text" id="kana_name" th:field="*{students.kanaName}" required />

    <label for="nickname">ニックネーム:</label>
    <input type="text" id="nickname" th:field="*{students.nickname}" required />

    <label for="email">メールアドレス:</label>
    <input type="email" id="email" th:field="*{students.email}" required />

    <label for="area">地域:</label>
    <select id="area" th:field="*{students.area}" required >
      <option value="">選択してください</option>
      <option value="東京">東京</option>
      <option value="大阪">大阪</option>
      <option value="京都">京都</option>
      <option value="横浜">横浜</option>
      <option value="名古屋">名古屋</option>
      <option value="神戸">神戸</option>
      <option value="福岡">福岡</option>
      <option value="札幌">札幌</option>
      <option value="広島">広島</option>
    </select>

    <label for="age">歳:</label>
    <input type="number" id="age" th:field="*{students.age}" required />

    <label for="sex">性別:</label>
    <select id="sex" th:field="*{students.sex}" required >
      <option value="">選択してください</option>
      <option value="男">男</option>
      <option value="女">女</option>
    </select><br><br>

    <input type="submit" value="登録">
    <input type="reset" value="再登録">

  </div>
</form>
</body>
</html>
