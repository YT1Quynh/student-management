<!DOCTYPE html>
<html>
<head>
  <title>新規受講生登録</title>
</head>
<body>
<h1>受講生登録</h1>
<form th:action="@{/registerStudent}" th:object="${studentDetail}" method="post">
  <div>
    <label for ="id">ID:</label>
    <input type="text" id="id" th:field="*{student.id}" />
  </div>

  <div>
    <label for="name">名前:</label>
    <input type="text" id="name" th:field="*{student.name}" />
  </div>

  <div>
    <label for="kana_name">カナ名:</label>
    <input type="text" id="kana_name" th:field="*{student.kanaName}" />
  </div>

  <div>
    <label for="nickname">ニックネーム:</label>
    <input type="text" id="nickname" th:field="*{student.nickname}" />
  </div>

  <div>
    <label for="email">メールアドレス:</label>
    <input type="email" id="email" th:field="*{student.email}" />
  </div>

  <div>
    <label for="area">地域:</label>
    <select id="area" th:field="*{student.area}" >
      <option value="">選択してください</option>
      <option value="東京">東京</option>
      <option value="大阪">大阪</option>
      <option value="京都">京都</option>
      <option value="横浜">横浜</option>
      <option value="名古屋">名古屋</option>
      <option value="神戸">神戸</option>
      <option value="福岡">福岡</option>
      <option value="札幌">札幌</option>
      <option value="広島">広島</option>
    </select>
  </div>

  <div>
    <label for="age">年齢:</label>
    <input type="number" id="age" th:field="*{student.age}" />
  </div>

  <div>
    <label for="sex">性別:</label>
    <select id="sex" th:field="*{student.sex}" >
      <option value="">選択してください</option>
      <option value="男">男</option>
      <option value="女">女</option>
    </select>
  </div>

  <div>
    <label for="remark">備考:</label>
    <input type="text" id="remark" th:field="*{student.remark}" >
  </div>

  <div>
    <label for="isDeleted">キャンセル:</label>
    <input type="checkbox" id="isDeleted" th:field="*{student.deleted}" >
  </div>

  <div th:each="course, stat : *{studentCourse}">
    <label for ="studentCourseId"
           th:for="studentCourse.__${stat.index}__.id">受講コースID</label>
    <input type="text" id="studentCourseId" th:id="studentCourse.__${stat.index}__.id"
           th:field="*{studentCourse[__${stat.index}__].id}"/>
    <label for="courseName"
           th:for="studentCourse.__${stat.index}__.courseName">受講コース名: </label>
    <input type="text" id="courseName" th:id="studentCourse.__${stat.index}__.courseName"
           th:field="*{studentCourse[__${stat.index}__].courseName}"/>
  </div>
  <div>
    <button type="submit">登録</button>
  </div>
</form>
</body>
</html>
